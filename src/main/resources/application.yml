server:
  port: ${PORT:8081}
  servlet:
    # Versioned so a future /api/v2 can exist without breaking existing clients (mirrors HRLMS-BE).
    context-path: /api/v1
  # Railway terminates TLS at its edge and forwards plain HTTP with X-Forwarded-Proto/-For to
  # this app - without this, request.isSecure() (HSTS header emission) and
  # request.getRemoteAddr() (rate-limit IP keying) would both see the proxy, not the real
  # client. "framework" lets Spring itself apply the forwarded headers rather than requiring a
  # container-level (Tomcat valve) config.
  forward-headers-strategy: framework

spring:
  application:
    name: vikisol-arena

  datasource:
    # DB_URL takes priority when set (Railway's managed Postgres injects a full jdbc URL via
    # DATABASE_URL - we read it as DB_URL to keep this app's own env-var naming consistent; the
    # Railway service just gets DB_URL=${{Postgres.DATABASE_URL}} wired in railway.toml). Falls
    # back to the original localhost/username/password parts for local dev against the same
    # Postgres install HRLMS-BE uses.
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:vikisol_arena}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Welcome@12345#}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway now owns schema changes (see DECISIONS.md's pg_dump-baseline entry) - validate
      # only confirms the entities match what Flyway already applied, never auto-alters.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Matches V1__baseline.sql's version exactly - baselining an already-populated database (the
    # existing local dev DB) marks it as "already at V1" without re-running V1's DDL, since V1 IS
    # that DB's current schema. A genuinely empty database (fresh Railway Postgres) never
    # triggers baselining at all - Flyway just runs V1 for real there.
    baseline-version: 1

  data:
    redis:
      # Railway's Redis addon injects REDIS_URL as redis://default:<password>@host:port. Local
      # dev falls back to the Memurai (Redis-compatible) Windows service on its default port,
      # no auth. Backs RefreshTokenService, TokenDenylistService, and RateLimitFilter.
      url: ${REDIS_URL:redis://localhost:6379}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    default-property-inclusion: non_null

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  jwt:
    # Local-dev-only fallback, never used in a real deployment - same pattern as HRLMS-BE. A
    # deployed environment MUST set a real JWT_SECRET (see BLOCKED.md/DECISIONS.md) - startup
    # fails loudly instead of silently signing with this fallback (see JwtSecretGuard).
    secret: ${JWT_SECRET:local-dev-only-arena-secret-do-not-use-in-any-deployed-environment-change-me}
    require-real-secret: ${JWT_REQUIRE_REAL_SECRET:false}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 min access token (was 24h - see DECISIONS.md)
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    issuer: ${JWT_ISSUER:vikisol-arena}
    audience: ${JWT_AUDIENCE:vikisol-arena-web}
    # See RefreshCookieHelper's class comment - false/Lax for local http://localhost dev,
    # true/None for staging/production over HTTPS on a different Railway subdomain.
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}
    # ARENA-MASTER-ARCHITECTURE.md PART 11 - blank in local dev (host-only cookie is fine when
    # both apps are on http://localhost); ".vikisol.in" in staging/prod so arena-web's own
    # server can read the session cookie api-arena.vikisol.in sets. See SessionCookieHelper.
    cookie-domain: ${JWT_COOKIE_DOMAIN:}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

  storage:
    # Local disk for now, behind FileStorageService so swapping in Cloudinary later (once
    # credentials exist) is a one-class change - see common/service/FileStorageService.
    root-dir: ${STORAGE_ROOT_DIR:./uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8081/api/v1/files}
    # Signed-URL secret for /files/** downloads (separate from the JWT secret so rotating one
    # doesn't invalidate the other) - see FileSigningService.
    signing-secret: ${FILE_SIGNING_SECRET:local-dev-only-file-signing-secret-change-me}
    signed-url-ttl-ms: ${FILE_SIGNED_URL_TTL_MS:600000} # 10 min

  seed:
    enabled: ${SEED_ENABLED:true}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # requests-per-window, keyed by client IP for unauthenticated endpoints (auth/*) and by user
    # id for authenticated ones (unlock/upload/messaging) - see RateLimitFilter.
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MIN:10}
    upload-per-minute: ${RATE_LIMIT_UPLOAD_PER_MIN:5}
    unlock-per-minute: ${RATE_LIMIT_UNLOCK_PER_MIN:20}
    messaging-per-minute: ${RATE_LIMIT_MESSAGING_PER_MIN:30}
    # ARENA-V2-PRODUCT-ARCHITECTURE.md §4 (Phase B).
    post-creation-per-minute: ${RATE_LIMIT_POST_CREATION_PER_MIN:5}
    join-request-per-minute: ${RATE_LIMIT_JOIN_REQUEST_PER_MIN:10}
    default-per-minute: ${RATE_LIMIT_DEFAULT_PER_MIN:120}

# Phase 5 integration scaffolding - Email/WhatsApp/Teams-meeting providers. All blank by default,
# which is exactly what keeps the Noop fallback active (see
# integration/config/IntegrationProviderConfig.java) with zero external calls made until a real
# deployment sets these. Same override convention as the DB/JWT config above.
resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:Vikisol Arena <no-reply@arena.vikisol.dev>}

whatsapp:
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}

teams:
  tenant-id: ${TEAMS_TENANT_ID:}
  client-id: ${TEAMS_CLIENT_ID:}
  client-secret: ${TEAMS_CLIENT_SECRET:}
  organizer-email: ${TEAMS_ORGANIZER_EMAIL:}

# ARENA-V2-PRODUCT-ARCHITECTURE.md §7.3 (Phase C) embedding-based feed ranking. Blank by default,
# which keeps HashingEmbeddingProvider (a real, local, zero-dependency embedding, not a stub -
# see its own class comment) active - same dormant-until-configured convention as resend/whatsapp/
# teams above.
openai:
  api-key: ${OPENAI_API_KEY:}
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# Google sign-in (AuthService.signInWithGoogle / GoogleIdTokenVerifier). Blank by default, which
# keeps POST /auth/google returning a clear "not configured" error instead of silently accepting
# unverifiable tokens - same dormant-until-configured convention as resend/whatsapp/teams above.
# Only the Client ID is needed (public, safe in the frontend too) - verification goes through
# Google's own tokeninfo endpoint, not a server-side authorization-code exchange, so no client
# secret exists to leak.
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# Dormant unless SENTRY_DSN is set - blank dsn disables the Sentry Spring Boot starter entirely
# (its auto-config no-ops with an empty DSN), matching the Noop-provider pattern used above.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  send-default-pii: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.vikisol.arena: INFO
