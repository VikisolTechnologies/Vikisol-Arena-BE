server:
  port: 8081
  servlet:
    # Versioned so a future /api/v2 can exist without breaking existing clients (mirrors HRLMS-BE).
    context-path: /api/v1

spring:
  application:
    name: vikisol-arena

  datasource:
    # Local Postgres only for this phase - distinct DB name from HRLMS's vikisol_one, same
    # localhost/username/password fallback convention as HRLMS-BE's application.yml so both
    # products work out of the box against the same local Postgres install.
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:vikisol_arena}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Welcome@12345#}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Matches HRLMS-BE - no migration tool in evidence there either, schema evolves via entity
      # changes directly. Every table this app owns is prefixed "arena_" (see decisions in
      # README) so ddl-auto never touches the unrelated pre-existing tables found in this same
      # local database.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    default-property-inclusion: non_null

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  jwt:
    # Local-dev-only fallback, never used in a real deployment - same pattern as HRLMS-BE.
    secret: ${JWT_SECRET:local-dev-only-arena-secret-do-not-use-in-any-deployed-environment-change-me}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h - simple SPA session, no refresh-token flow yet

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

  storage:
    # Local disk for now, behind FileStorageService so swapping in Cloudinary later (once
    # credentials exist) is a one-class change - see common/service/FileStorageService.
    root-dir: ${STORAGE_ROOT_DIR:./uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8081/api/v1/files}

  seed:
    enabled: ${SEED_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.vikisol.arena: INFO
